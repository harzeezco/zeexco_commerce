openapi: 3.1.0
info:
  title: Zeexco Core API
  version: 0.4.0
  description: All responses include an X-Request-ID correlation header. Selected expensive endpoints enforce per-process, per-client fixed-window rate limits.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the API process is running
      responses:
        '200': { description: API process is live. }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the API can reach PostgreSQL
      responses:
        '200': { description: API and PostgreSQL are ready. }
        '503': { description: PostgreSQL is unavailable. }
  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Return Prometheus text-format HTTP and rate-limit metrics
      responses:
        '200':
          description: Current process metrics.
          content:
            text/plain: { schema: { type: string } }
  /webhooks/whatsapp:
    get:
      operationId: verifyWhatsAppWebhook
      summary: Complete Meta webhook verification
      responses:
        '200': { description: Returns the supplied verification challenge. }
        '403': { description: Verification token or mode is invalid. }
    post:
      operationId: acceptWhatsAppWebhook
      summary: Verify and durably enqueue a Meta webhook delivery
      description: Verifies X-Hub-Signature-256, persists the original delivery in PostgreSQL, and acknowledges before asynchronous message, identity, or onboarding processing.
      responses:
        '200': { description: Delivery was durably stored for asynchronous processing. }
        '400': { description: Authenticated envelope is malformed. }
        '403': { description: X-Hub-Signature-256 verification failed. }
        '413': { description: Request body exceeds 1 MiB. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { description: Durable storage failed, so Meta should retry delivery. }
  /api/v1/whatsapp/flows:
    post:
      operationId: exchangeWhatsAppFlowData
      summary: Process encrypted Meta WhatsApp Flow Data Exchange requests
      description: >-
        Meta-compatible data_api_version 3.0 endpoint. Requests must carry a
        valid X-Hub-Signature-256 and the official encrypted_aes_key,
        encrypted_flow_data, and initial_vector envelope. Responses are
        encrypted base64 text, not JSON. Supports ping, INIT, and
        data_exchange. The flow_token is the opaque server-generated
        onboarding credential; form fields never identify the WhatsApp user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [encrypted_aes_key, encrypted_flow_data, initial_vector]
              properties:
                encrypted_aes_key: { type: string, format: byte }
                encrypted_flow_data: { type: string, format: byte }
                initial_vector: { type: string, format: byte }
      responses:
        '200':
          description: Encrypted Meta Flow response.
          content:
            text/plain: { schema: { type: string } }
        '400': { description: Malformed envelope, protocol payload, or unsupported action. }
        '421': { description: RSA request-key decryption failed; Meta should refresh the configured public key. }
        '427': { description: The correlated onboarding credential is invalid, expired, or consumed. }
        '432': { description: X-Hub-Signature-256 verification failed. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { description: The request could not be processed safely. }
  /api/v1/whatsapp/onboarding/validate:
    get:
      operationId: validateWhatsAppOnboardingToken
      summary: Validate a WhatsApp-originated browser registration token
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token is pending and the registration form may be shown.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, status, expires_at]
                properties:
                  valid: { type: boolean, const: true }
                  status: { type: string, const: PENDING }
                  expires_at: { type: string, format: date-time }
        '400': { description: Token is missing or malformed. }
        '404': { description: Token is unknown. }
        '409': { description: Token has already been consumed, or registration is waiting for email verification. }
        '410': { description: Token has expired. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/whatsapp/onboarding/register:
    post:
      operationId: registerWhatsAppMerchant
      summary: Register a merchant from a verified WhatsApp onboarding session
      description: >-
        Uses the same email/password registration service as web signup.
        Creates a PENDING user, business, OWNER membership, verification email
        job, and reserves the server-derived WhatsApp session atomically.
        The identity is linked only after email activation. No client-supplied
        provider, phone number, or WhatsApp identity is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppRegisterRequest' }
      responses:
        '202':
          description: Registration received; email verification is required before WhatsApp continuation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email, identity, or onboarding-token conflict. }
        '410': { description: The onboarding token has expired. }
        '413': { description: Request body exceeds 32 KiB. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /get-started:
    get:
      operationId: showWhatsAppOnboardingRegistration
      summary: Show the secure WhatsApp onboarding registration page
      deprecated: true
      description: Validates the opaque, short-lived `t` token. The sender identity is derived from the verified webhook session, never a phone-number query parameter.
      parameters:
        - in: query
          name: t
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Mobile-first registration form, or the idempotent completion page for an already-consumed token.
          content:
            text/html: { schema: { type: string } }
        '410':
          description: Token is malformed, unknown, expired, or in an invalid state.
          content:
            text/html: { schema: { type: string } }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: completeWhatsAppOnboardingRegistration
      summary: Atomically complete registration and link the verified WhatsApp identity
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, first_name, last_name, business_name]
              properties:
                token: { type: string }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                business_name: { type: string, maxLength: 200 }
      responses:
        '200': { description: Registration committed; returns the mobile-first WhatsApp continuation page. }
        '400': { description: Deterministic registration validation failed. }
        '409': { description: Email is already registered; no account or identity link was created. }
        '410': { description: Token is invalid, expired, consumed for submission, or in an invalid state. }
        '413': { description: Form exceeds 32 KiB. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { description: Completion failed and the transaction was rolled back. }
  /api/v1/auth/register:
    post:
      operationId: registerMerchant
      summary: Create a user, business, and OWNER membership
      description: >-
        Atomically creates a web account and business using required email and
        password credentials. An optional onboarding_token reserves a WhatsApp
        onboarding session; provider and sender identity are read only from
        that trusted session. Email verification completes the identity link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Pending user, business, OWNER membership, verification record, and durable email job were committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The normalized email is registered, the token is consumed, or the WhatsApp identity is already linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { description: Request body exceeds 16 KiB. }
        '410': { description: The supplied onboarding token has expired. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Activate a pending browser account
      description: >-
        Atomically consumes the signed, expiring, single-use token, activates
        the pending account, and queues one durable asynchronous welcome email.
        The request does not wait for the email provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '204': { description: Email verified, pending user activated, and welcome email durably queued. }
        '200':
          description: WhatsApp browser account activated, identity linked, and continuation destination returned. Frontend shows Continue in WhatsApp; the user must send the prefilled message.
          content:
            application/json:
              schema:
                type: object
                required: [status_code, message, next_step]
                properties:
                  status_code: { type: integer, const: 200 }
                  message: { type: string, example: Account activated successfully. Continue in WhatsApp. }
                  next_step: { type: string, const: CONTINUE_IN_WHATSAPP }
                  redirect_url:
                    type: string
                    format: uri
                    description: Trusted server-configured wa.me public sender link with text=Continue. Omitted when no public return number is configured.
        '400': { description: Token or request body is invalid. }
        '409': { description: Token was already consumed. }
        '410': { description: Token has expired. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: >-
        Returns only status_code and message, and sets both the short-lived
        access JWT and rotating refresh credential in HttpOnly cookies.
        The browser sends cookies automatically on credentialed requests. No credentials, user, or
        business details are returned in the login JSON. Valid credentials for a pending account
        queue or renew a durable verification email instead of creating a session.
      parameters:
        - $ref: '#/components/parameters/RequiredOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authentication succeeded and access and refresh cookies were set.
          headers:
            Set-Cookie:
              description: Two Set-Cookie headers; access cookie Path=/, refresh cookie Path=/api/v1/auth. Both HttpOnly, Secure and SameSite=Lax by default.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403':
          description: Account is pending verification, or the request origin is absent or untrusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshAuthentication
      summary: Rotate the refresh session and mint a new access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequiredOrigin'
      responses:
        '200':
          description: Refresh credential rotated and both cookies renewed. JSON contains only status_code and message.
          headers:
            Set-Cookie:
              description: Two Set-Cookie headers containing the renewed access JWT and rotated refresh credential.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401': { $ref: '#/components/responses/InvalidRefreshSession' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      description: Revokes the refresh session and expires both cookies. A previously copied access JWT remains valid until its short expiry.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequiredOrigin'
      responses:
        '204':
          description: The refresh session is revoked or was already absent.
          headers:
            Set-Cookie:
              description: Two Set-Cookie headers expiring the access and refresh cookies with their original paths.
              schema: { type: string }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Get the current session for frontend authorization
      description: >-
        Verifies the access cookie and loads the current user and business
        membership roles from PostgreSQL. Only active accounts succeed.
        Returns no credentials and does not refresh or rotate cookies.
        On 401, POST to refresh once and retry; on failed refresh return to login.
        Roles are for frontend presentation; backend authorization remains authoritative.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Active user and current business authorization context.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The account is no longer active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user and business memberships
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Minimum current-user and business-membership context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    RequiredOrigin:
      in: header
      name: Origin
      required: true
      description: Must exactly match PUBLIC_FRONTEND_BASE_URL for cookie-authenticated state changes.
      schema: { type: string, format: uri }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional legacy Bearer credential for non-browser clients. Browser sessions use the access cookie, which takes precedence.
    accessCookie:
      type: apiKey
      in: cookie
      name: zeexco_access
      description: HttpOnly access JWT with Path=/; name configurable via AUTH_ACCESS_COOKIE_NAME.
    refreshCookie:
      type: apiKey
      in: cookie
      name: zeexco_refresh
      description: Opaque rotating refresh credential; the configured name may differ.
  responses:
    RateLimited:
      description: Per-client request limit exceeded. Retry after the number of seconds in Retry-After.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CSRFRejected:
      description: Origin is absent or does not exactly match the configured frontend origin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid JSON or deterministic field validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Generic invalid email/password response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: INVALID_CREDENTIALS, message: email or password is invalid }
    InvalidRefreshSession:
      description: Refresh cookie is absent, expired, revoked, rotated, or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Access cookie or optional Bearer access token is absent or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: The operation could not be completed safely.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, business_name, email, password]
      properties:
        onboarding_token: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        business_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: >-
            Must contain at least one Unicode letter (uppercase or lowercase),
            one decimal digit, and one punctuation or symbol character.
            Spaces do not count as symbols. The server requires at least 8
            characters and no more than 72 UTF-8 bytes for bcrypt compatibility;
            passwords are not trimmed.
    WhatsAppRegisterRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, business_name, email, password, onboarding_token]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        business_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 255 }
        password: { $ref: '#/components/schemas/RegisterRequest/properties/password' }
        onboarding_token: { type: string, minLength: 1, writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [status_code, message]
      properties:
        status_code: { type: integer, enum: [200] }
        message: { type: string, example: Login successful. Welcome back }
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [status_code, message]
      properties:
        status_code: { type: integer, enum: [200] }
        message: { type: string, example: Session refreshed successfully. }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [status_code, message, user, businesses]
      properties:
        status_code: { type: integer, enum: [200] }
        message: { type: string, example: Session retrieved successfully. }
        user: { $ref: '#/components/schemas/RegisteredUser' }
        businesses:
          type: array
          items: { $ref: '#/components/schemas/AuthenticatedBusiness' }
    MeResponse:
      type: object
      required: [user, businesses]
      properties:
        user: { $ref: '#/components/schemas/RegisteredUser' }
        businesses:
          type: array
          items: { $ref: '#/components/schemas/AuthenticatedBusiness' }
    AuthenticatedBusiness:
      type: object
      required: [id, name, status, membership_role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        membership_role: { type: string, enum: [OWNER, ADMIN, STAFF] }
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [status_code, message]
      properties:
        status_code: { type: integer, enum: [202] }
        message:
          type: string
          example: Registration successful. Please check your email to activate your account.
    WhatsAppRegisterResponse:
      type: object
      required: [user, business, next_step]
      properties:
        user: { $ref: '#/components/schemas/RegisteredUser' }
        business: { $ref: '#/components/schemas/RegisteredBusiness' }
        next_step: { type: string, enum: [VERIFY_EMAIL, ADD_FIRST_PRODUCT] }
    RegisteredUser:
      type: object
      required: [id, first_name, last_name, status]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED] }
    RegisteredBusiness:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
